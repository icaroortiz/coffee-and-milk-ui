name: Deploy examples to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/react-shadcn/package-lock.json

      - name: Check repository
        run: python3 scripts/check_repository.py

      - name: Install locked dependencies
        working-directory: examples/react-shadcn
        run: npm ci

      - name: Build React for its Pages subdirectory
        working-directory: examples/react-shadcn
        env:
          PAGE_REPOSITORY: ${{ github.repository }}
        run: |
          repo_name="${PAGE_REPOSITORY#*/}"
          npm run build -- --base "/$repo_name/react/"

      - name: Stage gallery and React example
        env:
          PAGE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/build_site.py --repository "$PAGE_REPOSITORY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish examples
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
